server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy the API to the backend service; a route request can take a few seconds.
  location ~ ^/(routes|geocode|health) {
    proxy_pass http://backend:8080;
    proxy_read_timeout 120s;
  }

  # Correct MIME type for the PWA manifest (nginx's default mime.types omits it);
  # the service worker must not be cached so autoUpdate can ship new builds.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
