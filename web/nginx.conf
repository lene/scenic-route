server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy the API to the backend service; a route request can take a few seconds.
  location ~ ^/(routes|geocode|health) {
    proxy_pass http://backend:8080;
    proxy_read_timeout 120s;
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
