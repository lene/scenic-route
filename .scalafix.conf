rules = [
  OrganizeImports,
  DisableSyntax,
  NoValInForComprehension,
]

DisableSyntax.noVars = true
DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = false

OrganizeImports.groupedImports = Merge
# scalafmt's SortImports owns within-brace selector order; Keep avoids a tug-of-war
# where each tool rewrites `{cos, sqrt, Pi}` back to its own ordering.
OrganizeImports.importSelectorsOrder = Keep
